name: CAMIDAX Updater Qualification 0.0.25 to 0.0.26

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-updater:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Prepare result directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path C:\camidax-qualification -Force | Out-Null
          "CAMIDAX 0.0.25 -> 0.0.26 updater qualification" | Set-Content C:\camidax-qualification\summary.txt
          "Started: $(Get-Date -Format o)" | Add-Content C:\camidax-qualification\summary.txt

      - name: Download exact 0.0.25 test fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Url = 'https://github.com/mdjense502/camidax-releases/releases/download/camidax-0.0.25-updater-fixture/CAMIDAX-Setup-x64-0.0.25.exe'
          $Out = 'C:\camidax-qualification\CAMIDAX-Setup-x64-0.0.25.exe'
          Invoke-WebRequest -Uri $Url -OutFile $Out -UseBasicParsing
          $Expected = '19E66F205CF28F45A5957970FDA3BB03B287872907E149AF63C508CA6541AD2E'
          $Actual = (Get-FileHash $Out -Algorithm SHA256).Hash
          "Fixture SHA256: $Actual" | Add-Content C:\camidax-qualification\summary.txt
          if ($Actual -ne $Expected) { throw "0.0.25 fixture hash mismatch: $Actual" }

      - name: Install 0.0.25 silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Installer = 'C:\camidax-qualification\CAMIDAX-Setup-x64-0.0.25.exe'
          $Args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-')
          $P = Start-Process -FilePath $Installer -ArgumentList $Args -PassThru -Wait
          if ($P.ExitCode -ne 0) { throw "0.0.25 installer exit code $($P.ExitCode)" }
          Start-Sleep -Seconds 8
          $Exe = 'C:\Program Files\CAMIDAX\CAMIDAX.exe'
          if (-not (Test-Path $Exe)) { throw 'CAMIDAX.exe missing after 0.0.25 install' }
          $Item = Get-Item $Exe
          $VersionText = "$($Item.VersionInfo.ProductVersion) $($Item.VersionInfo.FileVersion)"
          "Pre-update ProductVersion: $($Item.VersionInfo.ProductVersion)" | Add-Content C:\camidax-qualification\summary.txt
          "Pre-update FileVersion: $($Item.VersionInfo.FileVersion)" | Add-Content C:\camidax-qualification\summary.txt
          if ($VersionText -notmatch '0\.0\.25') { throw "Installed client is not 0.0.25: $VersionText" }

      - name: Trigger real CAMIDAX background updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Exe = 'C:\Program Files\CAMIDAX\CAMIDAX.exe'
          $P = Start-Process -FilePath $Exe -ArgumentList '--background-update' -PassThru
          if (-not $P.WaitForExit(300000)) {
            Stop-Process -Id $P.Id -Force -ErrorAction SilentlyContinue
            throw 'Background updater did not return within 5 minutes'
          }
          "Updater entry-point exit code: $($P.ExitCode)" | Add-Content C:\camidax-qualification\summary.txt

      - name: Wait for updater handoff and verify 0.0.26
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Exe = 'C:\Program Files\CAMIDAX\CAMIDAX.exe'
          $Deadline = (Get-Date).AddMinutes(25)
          $Reached = $false
          do {
            Start-Sleep -Seconds 10
            if (Test-Path $Exe) {
              try {
                $Item = Get-Item $Exe
                $VersionText = "$($Item.VersionInfo.ProductVersion) $($Item.VersionInfo.FileVersion)"
                Write-Host "Current installed version: $VersionText"
                if ($VersionText -match '0\.0\.26') {
                  $Reached = $true
                  break
                }
              } catch {
                Write-Host "Install handoff in progress: $($_.Exception.Message)"
              }
            }
          } while ((Get-Date) -lt $Deadline)

          if (-not $Reached) { throw 'Installed CAMIDAX did not become 0.0.26 within 25 minutes' }

          $Final = Get-Item $Exe
          "Post-update ProductVersion: $($Final.VersionInfo.ProductVersion)" | Add-Content C:\camidax-qualification\summary.txt
          "Post-update FileVersion: $($Final.VersionInfo.FileVersion)" | Add-Content C:\camidax-qualification\summary.txt
          "Post-update CAMIDAX.exe SHA256: $((Get-FileHash $Exe -Algorithm SHA256).Hash)" | Add-Content C:\camidax-qualification\summary.txt

      - name: Verify Forge Local Engine payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Engine = 'C:\Program Files\CAMIDAX\runtime\forge\ollama\ollama.exe'
          $License = 'C:\Program Files\CAMIDAX\licenses\Ollama-LICENSE.txt'
          if (-not (Test-Path $Engine)) { throw 'Forge Local Engine runtime missing after update' }
          if (-not (Test-Path $License)) { throw 'Forge Local Engine license missing after update' }
          "Forge Local Engine payload: PASS" | Add-Content C:\camidax-qualification\summary.txt
          "Forge engine SHA256: $((Get-FileHash $Engine -Algorithm SHA256).Hash)" | Add-Content C:\camidax-qualification\summary.txt

      - name: Collect updater evidence
        if: always()
        shell: pwsh
        run: |
          $Candidates = @(
            "$env:LOCALAPPDATA\CAMIDAX\OmniCore\config\updater-audit.jsonl",
            "$env:LOCALAPPDATA\CAMIDAX\config\updater-audit.jsonl",
            'C:\Program Files\CAMIDAX\config\updater-audit.jsonl',
            "$env:LOCALAPPDATA\CAMIDAX\OmniCore\config\update-handoff.jsonl",
            "$env:LOCALAPPDATA\CAMIDAX\config\update-handoff.jsonl"
          )
          foreach ($Path in $Candidates) {
            if (Test-Path $Path) {
              $Name = Split-Path $Path -Leaf
              Copy-Item $Path (Join-Path 'C:\camidax-qualification' $Name) -Force
            }
          }
          "Finished: $(Get-Date -Format o)" | Add-Content C:\camidax-qualification\summary.txt
          Get-Content C:\camidax-qualification\summary.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camidax-0.0.25-to-0.0.26-updater-evidence
          path: C:\camidax-qualification
          if-no-files-found: error
